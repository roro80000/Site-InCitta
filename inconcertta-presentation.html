<style>
/* ============================================================
   INCONCERTTA PRESENTATION — Design System
   Palette : #002532 teal-dark | #003640 teal-mid | #BF7D40 orange
             #053b3b primary | #11b6b6 accent | #E8F1F4 light
   ============================================================ */
:root {
  --teal-dark:   #002532;
  --teal-mid:    #003640;
  --teal-light:  #0b5060;
  --orange:      #BF7D40;
  --orange-h:    #a66a35;
  --orange-lt:   #d4956a;
  --accent:      #11b6b6;
  --accent-dim:  rgba(17,182,182,0.18);
  --primary:     #053b3b;
  --light:       #E8F1F4;
  --white:       #ffffff;
  --text-dim:    rgba(232,241,244,0.85);
  --text-mid:    rgba(232,241,244,0.95);
  --border:      rgba(255,255,255,0.08);
  --border-o:    rgba(191,125,64,0.28);
  --radius:      16px;
  --radius-lg:   24px;
  --shadow-soft: 0 18px 48px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255,255,255,0.06);
  --shadow-glow: 0 10px 40px rgba(17, 182, 182, 0.12), 0 16px 60px rgba(191, 125, 64, 0.12);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%; overflow: hidden;
  font-family: 'Inter', system-ui, sans-serif;
  background:
    radial-gradient(1200px 600px at 10% 0%, rgba(17,182,182,0.08), transparent 45%),
    radial-gradient(900px 500px at 100% 10%, rgba(191,125,64,0.12), transparent 35%),
    linear-gradient(135deg, #000 0%, #00161e 45%, #001b22 100%);
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed; inset: -20%;
  background:
    radial-gradient(circle at 20% 20%, rgba(17,182,182,0.08), transparent 22%),
    radial-gradient(circle at 80% 30%, rgba(191,125,64,0.10), transparent 18%),
    radial-gradient(circle at 50% 70%, rgba(255,255,255,0.04), transparent 18%);
  filter: blur(18px);
  animation: drift 20s ease-in-out infinite alternate;
  pointer-events: none;
  z-index: 0;
}

/* ── VIEWPORT / SCENE ── */
#scene {
  position: fixed; inset: 0;
  z-index: 1;
  background:
    linear-gradient(135deg, rgba(0,37,50,0.96) 0%, rgba(0,54,64,0.92) 45%, rgba(0,20,28,0.98) 100%);
  overflow: hidden;
  pointer-events: none;
}
#scene::after {
  content: "";
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size: 72px 72px;
  mask-image: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.85));
  opacity: 0.28;
  pointer-events: none;
}

/* ── SLIDE STAGE ── */
#stage {
  position: absolute; inset: 0;
  will-change: transform, filter;
  transition: transform 0.95s cubic-bezier(0.22, 1, 0.36, 1), filter 0.6s ease;
  transform-style: preserve-3d;
  pointer-events: auto;
}

/* ── INDIVIDUAL SLIDES ── */
.slide {
  position: absolute;
  width: 100vw; height: 100vh;
  top: 0; left: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  opacity: 0.97;
  transform: translateZ(0);
  transition: opacity 0.45s ease, transform 0.45s ease;
}
.slide::before {
  content: "";
  position: absolute; inset: 0;
  background:
    linear-gradient(135deg, rgba(17,182,182,0.04), transparent 20%, rgba(191,125,64,0.06) 80%, transparent 100%);
  opacity: 0;
  transition: opacity 0.45s ease;
  pointer-events: none;
}
.slide:hover::before { opacity: 1; }
.slide.active { filter: saturate(1.05); }

/* ── GRID NOISE / TEXTURE ── */
.noise {
  position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,0.015) 40px, rgba(255,255,255,0.015) 41px),
    repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.015) 40px, rgba(255,255,255,0.015) 41px);
}

/* ── GLOW CIRCLES ── */
.glow {
  position: absolute; border-radius: 50%; pointer-events: none; z-index: 0;
  filter: blur(80px);
}

/* ── NAV ── */
#nav {
  position: fixed; bottom: 18px; right: 22px; left: auto;
  transform: none;
  z-index: 1100;
  pointer-events: auto;
  display: flex; align-items: center; gap: 6px;
  background: rgba(0, 28, 36, 0.42);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 100px;
  padding: 5px 10px;
  backdrop-filter: blur(10px) saturate(140%);
  box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  opacity: 0.38;
  transition: opacity 0.25s ease, background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}
#nav:hover, #nav:focus-within {
  opacity: 1;
  background: rgba(0, 37, 50, 0.78);
  border-color: rgba(191,125,64,0.18);
  box-shadow: 0 8px 24px rgba(0,0,0,0.28);
}
#nav-prev, #nav-next {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
  cursor: pointer;
  color: rgba(232,241,244,0.75); font-size: 12px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  font-family: inherit;
  box-shadow: none;
}
#nav:hover #nav-prev, #nav:hover #nav-next,
#nav:focus-within #nav-prev, #nav:focus-within #nav-next {
  background: rgba(191,125,64,0.22);
  border-color: rgba(191,125,64,0.35);
  color: var(--white);
}
#nav-prev:hover, #nav-next:hover { transform: translateY(-1px); background: rgba(191,125,64,0.32); color: var(--white); }
#nav-prev:disabled, #nav-next:disabled { background: rgba(255,255,255,0.04); opacity: 0.35; cursor: default; transform: none; color: rgba(232,241,244,0.35); }
#nav-counter { color: rgba(232,241,244,0.45); font-size: 10px; font-weight: 500; min-width: 44px; text-align: center; letter-spacing: 0.04em; font-family: 'Space Grotesk', sans-serif; transition: color 0.25s ease; }
#nav:hover #nav-counter, #nav:focus-within #nav-counter { color: rgba(232,241,244,0.75); }
#nav-fs {
  background: transparent; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px; color: rgba(232,241,244,0.4);
  padding: 3px 8px; font-size: 9px; cursor: pointer; font-family: inherit;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
  letter-spacing: 0.02em;
}
#nav:hover #nav-fs, #nav:focus-within #nav-fs { color: rgba(232,241,244,0.65); border-color: rgba(255,255,255,0.14); }
#nav-fs:hover { color: var(--orange); border-color: rgba(191,125,64,0.4); background: rgba(191,125,64,0.08); }

.nav-side {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  z-index: 1095;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(0, 28, 36, 0.38);
  color: rgba(232,241,244,0.55);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(10px) saturate(140%);
  box-shadow: 0 4px 16px rgba(0,0,0,0.16);
  opacity: 0.32;
  transition: opacity 0.25s ease, background 0.25s ease, border-color 0.25s ease, color 0.25s ease, transform 0.18s ease;
  font-family: inherit;
  padding: 0;
}
.nav-side svg { width: 18px; height: 18px; display: block; }
.nav-side--prev { left: 18px; }
.nav-side--next { right: 18px; }
.nav-side:hover {
  opacity: 1;
  background: rgba(0, 37, 50, 0.78);
  border-color: rgba(191,125,64,0.28);
  color: var(--white);
  transform: translateY(calc(-50% - 1px));
}
.nav-side:disabled {
  opacity: 0.12;
  cursor: default;
  pointer-events: none;
  transform: translateY(-50%);
}
body.overview-open #nav,
body.overview-open .nav-side { opacity: 0; pointer-events: none; }

/* ── PROGRESS BAR ── */
#progress {
  position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 1001;
  background: rgba(255,255,255,0.06);
}
#progress-bar {
  height: 100%; background: linear-gradient(90deg, var(--orange), var(--accent));
  transition: width 0.72s cubic-bezier(0.76,0,0.24,1);
  border-radius: 0 2px 2px 0;
}

/* ── SLIDE DOTS ── */
#dots {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  z-index: 1100; display: flex; gap: 6px; align-items: center;
  pointer-events: auto;
}
.dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,255,255,0.2); cursor: pointer;
  transition: all 0.3s; border: none;
}
.dot.active { background: var(--orange); transform: scale(1.5); }
.dot:hover:not(.active) { background: rgba(255,255,255,0.5); }

/* ── SECTION LABEL ── */
.section-label {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--orange); margin-bottom: 16px;
}
.section-label::before {
  content: ''; display: block; width: 20px; height: 1px; background: var(--orange);
}

/* ── CARD ── */
.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  backdrop-filter: blur(10px);
  box-shadow: var(--shadow-soft);
  transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
}

.bubble-card {
  position: relative;
  overflow: hidden;
  border-radius: 26px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.32);
  transform: translateY(0) scale(1);
  transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
}

.bubble-card::before,
.bubble-card::after {
  content: "";
  position: absolute;
  border-radius: 999px;
  background: radial-gradient(circle, rgba(191,125,64,0.18), rgba(191,125,64,0.02) 65%, transparent 66%);
  filter: blur(8px);
  opacity: 0.7;
  pointer-events: none;
}

.bubble-card::before { width: 90px; height: 90px; top: -18px; right: -10px; }
.bubble-card::after { width: 70px; height: 70px; left: -10px; bottom: -12px; background: radial-gradient(circle, rgba(17,182,182,0.16), rgba(17,182,182,0.02) 65%, transparent 66%); }

.bubble-card:hover {
  transform: translateY(-4px) scale(1.04);
  border-color: rgba(191,125,64,0.35);
  background: rgba(255,255,255,0.08);
  box-shadow: 0 24px 48px rgba(191,125,64,0.12), 0 16px 34px rgba(0,0,0,0.36);
}

/* ── 3 ÉTAPES — conteneurs ronds ── */
.steps-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 36px;
  max-width: 960px;
  margin: 0 auto;
  align-items: center;
}
.step-circle {
  aspect-ratio: 1;
  width: min(100%, 270px);
  margin: 0 auto;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 28px 22px;
  background: radial-gradient(circle at 35% 25%, rgba(255,255,255,0.08), rgba(255,255,255,0.03) 55%, rgba(0,37,50,0.35) 100%);
  border: 1px solid rgba(255,255,255,0.14);
  box-shadow: 0 20px 44px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.08);
  position: relative;
  overflow: hidden;
  transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.25s, box-shadow 0.25s;
}
.step-circle::before {
  content: "";
  position: absolute;
  inset: -20%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(191,125,64,0.14), transparent 62%);
  pointer-events: none;
}
.step-circle:hover {
  transform: scale(1.05);
  border-color: rgba(191,125,64,0.4);
  box-shadow: 0 26px 52px rgba(191,125,64,0.14), 0 18px 40px rgba(0,0,0,0.38);
}
.step-circle-num {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px;
  font-weight: 700;
  color: var(--orange);
  letter-spacing: 0.14em;
  margin-bottom: 12px;
  position: relative;
}
.step-circle-icon {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: rgba(191,125,64,0.16);
  border: 1px solid rgba(191,125,64,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
  position: relative;
}
.step-circle-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--white);
  line-height: 1.25;
  margin-bottom: 10px;
  font-family: 'Space Grotesk', sans-serif;
  position: relative;
}
.step-circle-desc {
  font-size: 11.5px;
  color: var(--text-dim);
  line-height: 1.55;
  position: relative;
}
.card:hover,
.tool-cell:hover,
.a11y-item:hover,
.sec-item:hover {
  transform: translateY(-3px) scale(1.15);
  border-color: rgba(191,125,64,0.35);
  box-shadow: var(--shadow-glow);
  z-index: 10;
}
.card-orange { background: rgba(191,125,64,0.12); border-color: var(--border-o); }
.card-accent { background: rgba(17,182,182,0.08); border-color: rgba(17,182,182,0.18); }

/* ── SCREEN MOCKUP ── */
.mockup {
  border-radius: 14px;
  overflow: hidden;
  background: rgba(0, 28, 34, 0.95);
  box-shadow: 0 24px 64px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.1), inset 0 1px 0 rgba(255,255,255,0.06);
  position: relative;
  transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease;
}
.mockup:hover {
  transform: translateY(-4px);
  box-shadow: 0 32px 80px rgba(0,0,0,0.65), 0 0 0 1px rgba(191,125,64,0.28);
  z-index: 10;
}
.mockup-titlebar {
  height: 36px;
  background: linear-gradient(180deg, rgba(0,54,64,0.98) 0%, rgba(0,42,50,0.98) 100%);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; gap: 10px; padding: 0 14px;
}
.mockup-traffic { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
.mockup-dot { width: 10px; height: 10px; border-radius: 50%; display: block; }
.mockup-dot--close { background: #ff5f57; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); }
.mockup-dot--min { background: #febc2e; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); }
.mockup-dot--max { background: #28c840; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); }
.mockup-title {
  flex: 1; text-align: center;
  font-size: 11px; font-weight: 600; color: rgba(232,241,244,0.55);
  font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.03em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mockup-titlebar-spacer { width: 52px; flex-shrink: 0; }
.mockup-viewport {
  background: #0a1619;
  line-height: 0;
}
.mockup-viewport img {
  display: block;
  width: 100%;
  height: auto;
  max-width: 100%;
}
.mockup--compact { max-width: 100%; }
.mockup--compact .mockup-titlebar { height: 28px; padding: 0 10px; }
.mockup--compact .mockup-dot { width: 8px; height: 8px; }
.mockup--compact .mockup-title { font-size: 9px; }
.mockup--compact .mockup-titlebar-spacer { width: 40px; }
.mockup-stack { display: flex; flex-direction: column; gap: 14px; }
.mockup-stack--budget {
  width: 75%;
  max-width: 75%;
  margin: 0 auto;
  padding: 16px;
  border-radius: 18px;
  border: 1px solid rgba(191,125,64,0.22);
  background: rgba(0, 24, 30, 0.55);
  box-shadow: 0 16px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
}
.mockup-wrap--70 {
  width: 70%;
  max-width: 70%;
  margin: 0 auto;
}
.mockup-wrap--80 {
  width: 80%;
  max-width: 80%;
  margin: 0 auto;
}
.mockup-mobile-row--inline {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 20px;
  margin-top: 20px;
  flex-wrap: wrap;
}
.mobile-shot-wrap {
  width: clamp(120px, 42%, 180px);
  flex-shrink: 0;
}
.mobile-shot {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 14px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.08);
}
.mobile-shot-label {
  text-align: center;
  margin-top: 8px;
  font-size: 9px;
  font-weight: 600;
  color: rgba(232,241,244,0.45);
  font-family: 'Space Grotesk', sans-serif;
  letter-spacing: 0.04em;
}
.mockup-thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.mockup-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.mockup-mobile-row { display: flex; justify-content: center; align-items: flex-end; gap: 28px; margin-top: 28px; flex-wrap: wrap; }
.mockup-mobile {
  width: clamp(140px, 16vw, 190px);
  border-radius: 32px;
  padding: 12px 10px 14px;
  background: linear-gradient(165deg, #3a3a40 0%, #1e1e22 40%, #121214 100%);
  box-shadow: 0 20px 50px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.12), inset 0 1px 0 rgba(255,255,255,0.08);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.mockup-mobile:hover {
  transform: translateY(-4px);
  box-shadow: 0 28px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(17,182,182,0.25);
}
.mockup-mobile-notch {
  width: 52px; height: 5px; border-radius: 100px;
  background: rgba(0,0,0,0.45); margin: 0 auto 10px;
}
.mockup-mobile-screen {
  border-radius: 18px; overflow: hidden;
  background: #0a1619; line-height: 0;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
}
.mockup-mobile-screen img {
  display: block; width: 100%; height: auto;
}
.mockup-mobile-label {
  text-align: center; margin-top: 10px;
  font-size: 10px; font-weight: 600; color: rgba(232,241,244,0.45);
  font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.04em;
}

/* ── PILL TAG ── */
.pill {
  display: inline-flex; align-items: center;
  background: rgba(191,125,64,0.15); border: 1px solid rgba(191,125,64,0.3);
  border-radius: 100px; padding: 5px 13px;
  font-size: 11px; font-weight: 600; color: var(--orange);
  font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.04em;
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
}
.pill:hover { background: rgba(191,125,64,0.24); border-color: rgba(191,125,64,0.5); transform: translateY(-1px); }
.pill-accent { background: rgba(17,182,182,0.12); border-color: rgba(17,182,182,0.3); color: var(--accent); }

/* ── ANIMATED LINE ── */
@keyframes line-in { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.line-anim {
  height: 2px; background: linear-gradient(90deg, var(--orange), transparent);
  transform-origin: left; animation: line-anim 0.8s 0.4s ease both;
}

/* ── FEATURE ROW ── */
.feat-row {
  display: flex; align-items: flex-start; gap: 12px; padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.feat-row:last-child { border-bottom: none; }
.feat-icon {
  width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
  background: rgba(191,125,64,0.15); border: 1px solid rgba(191,125,64,0.2);
  display: flex; align-items: center; justify-content: center;
}
.feat-icon svg { width: 14px; height: 14px; fill: var(--orange); }
.feat-label { font-size: 12.5px; font-weight: 600; color: var(--light); line-height: 1; margin-bottom: 3px; }

/* ── OVERVIEW MODE (Prezi) ── */

/* ── OVERVIEW ART (SVG vignettes) ── */
.ov-art {

.ov-art--tool .ov-art-glow { width: 65px; height: 65px; background: rgba(191,125,64,0.32); top: 50%; left: 50%; transform: translate(-50%,-50%); }

.ov-thumb:hover .ov-art--framework .ov-art-glow,

.ov-art-num {

.ov-art-icon {

}

}

}

.ov-art-accent {
  position: absolute; bottom: 0; left: 0; right: 0; height: 2px; z-index: 4;

}
.ov-art--root .ov-art-accent { background: linear-gradient(90deg, transparent, var(--orange), transparent); }
.ov-art--framework .ov-art-accent { background: linear-gradient(90deg, transparent, var(--accent), transparent); }

@keyframes ov-shimmer {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

}

}

}

.ov-label { padding: 5px 8px; font-size: 9px; font-weight: 600; color: var(--text-dim); font-family: 'Space Grotesk', sans-serif; line-height: 1.3; background: rgba(0,25,34,0.92); }

/* ── OVERVIEW TOGGLE BUTTON ── */
#ov-btn {
  position: fixed; top: 14px; right: 20px; z-index: 1100;
  pointer-events: auto;
  background: rgba(0,37,50,0.85); border: 1px solid var(--border-o);

}

  background: var(--orange); color: var(--white);
  border-color: var(--orange); box-shadow: 0 4px 20px rgba(191,125,64,0.35);
}

/* ── TIMELINE (slide 3) ── */
.timeline { position: relative; }
.timeline::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 1px;
  background: linear-gradient(to bottom, var(--orange), rgba(191,125,64,0.1));
}
.tl-item { padding: 0 0 24px 28px; position: relative; }
.tl-item::before {
  content: ''; position: absolute; left: -4px; top: 4px;
  width: 9px; height: 9px; border-radius: 50%;

}

.tl-title { font-size: 13px; font-weight: 700; color: var(--light); margin-bottom: 4px; }

/* ── TOOL GRID (slide 9) ── */
.tool-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
.tool-cell {
  padding: 16px; border-radius: var(--radius);

}

// ══════════════════════════════════════════════════════════════════
// ENGINE
// ══════════════════════════════════════════════════════════════════

const stage = document.getElementById('stage');
const total = slides.length;
let current = 0;

// Build slides
slides.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide' + (i === 0 ? ' active' : '');
  el.id = 'slide-' + i;
  el.style.transform = `translateX(${i * 100}vw)`;
  el.innerHTML = s.html;
  stage.appendChild(el);
});

// Build dots
const dotsEl = document.getElementById('dots');
slides.forEach((_, i) => {
  const d = document.createElement('button');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.onclick = () => goto(i);
  d.setAttribute('aria-label', `Diapositive ${i+1}`);
  dotsEl.appendChild(d);
});

// Build overview thumbnails (Prezi layout)
const ovCanvas = document.getElementById('ov-canvas');
const ovThumbs = document.getElementById('ov-thumbs');
const ovLinks = document.getElementById('ov-links');
function getOvCategory(i) {
  if (i === 0) return 'root';
  if (i >= 12 && i <= 14) return 'hub';
  if (i >= 5 && i <= 11) return 'tool';
  if (i >= 1 && i <= 4) return 'framework';
  if (i >= 15) return 'closing';
  return 'framework';
}
slides.forEach((s, i) => {
  const cat = getOvCategory(i);
  const th = document.createElement('div');
  th.className = 'ov-thumb ov-' + cat + (i === 0 ? ' active' : '');
  th.dataset.index = i;
  th.onclick = () => { goto(i); setOverview(false); };
  th.innerHTML = `<div class="ov-thumb-inner">${ovArtHtml(i, cat)}</div><div class="ov-label">${String(i+1).padStart(2,'0')} — ${s.label}</div>`;
  ovThumbs.appendChild(th);
});

function placeThumb(th, x, y, transform) {
  th.style.left = x + 'px';
  th.style.top = y + 'px';
  th.style.transform = transform || 'translate(-50%, -50%)';
}

function ovThumbImageCenter(th) {
  const inner = th.querySelector('.ov-thumb-inner');
  const canvasRect = ovCanvas.getBoundingClientRect();
  const rect = inner.getBoundingClientRect();
  return {
    x: rect.left - canvasRect.left + rect.width / 2,
    y: rect.top - canvasRect.top + rect.height / 2
  };
}

function ovLinePath(a, b) {
  return `M ${a.x} ${a.y} L ${b.x} ${b.y}`;
}

function ovCurvePath(a, b, bend = 0.26) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  if (Math.abs(dx) < 6) return ovLinePath(a, b);
  const cx1 = a.x + dx * bend;
  const cy1 = a.y + dy * 0.08;
  const cx2 = b.x - dx * bend;
  const cy2 = b.y - dy * 0.08;
  return `M ${a.x} ${a.y} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${b.x} ${b.y}`;
}

function nearestHubCenter(target, hubEls) {
  let best = ovThumbImageCenter(hubEls[0]);
  let bestDist = Infinity;
  for (const h of hubEls) {
    const c = ovThumbImageCenter(h);
    const d = (target.x - c.x) ** 2 + (target.y - c.y) ** 2;
    if (d < bestDist) {
      bestDist = d;
      best = c;
    }
  }
  return best;
}

function updateHubGuide(hubEls) {
  if (!hubEls.length) return;
  const canvasRect = ovCanvas.getBoundingClientRect();
  const rects = hubEls.map(th => th.querySelector('.ov-thumb-inner').getBoundingClientRect());
  const pad = 18;
  const left = Math.min(...rects.map(r => r.left)) - canvasRect.left - pad;
  const right = Math.max(...rects.map(r => r.right)) - canvasRect.left + pad;
  const top = Math.min(...rects.map(r => r.top)) - canvasRect.top - pad;
  const bottom = Math.max(...rects.map(r => r.bottom)) - canvasRect.top + pad;
  ovCanvas.style.setProperty('--hub-guide-left', (left + (right - left) / 2) + 'px');
  ovCanvas.style.setProperty('--hub-guide-top', top + 'px');
  ovCanvas.style.setProperty('--hub-guide-width', (right - left) + 'px');
  ovCanvas.style.setProperty('--hub-guide-height', (bottom - top) + 'px');
}

function drawOverviewLinks(rootEls, hubEls, toolEls, frameworkEls, closingEls) {
  const W = ovCanvas.clientWidth;
  const H = ovCanvas.clientHeight;
  if (!W || !H) return;
  ovLinks.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const roots = rootEls.map(ovThumbImageCenter);
  const hubs = hubEls.map(ovThumbImageCenter);
  const tools = toolEls.map(ovThumbImageCenter);
  const framework = frameworkEls.map(ovThumbImageCenter);
  const closing = closingEls.map(ovThumbImageCenter);
  if (!hubs.length) return;

  const lines = [];
  const rootRef = roots[0] || hubs[0];

  // Tronc principal bleu (centres des vignettes, aligné sur la colonne hub).
  lines.push(`<path class="ov-link-main" d="${ovCurvePath(rootRef, hubs[0], 0.16)}"></path>`);
  for (let i = 0; i < hubs.length - 1; i++) {
    lines.push(`<path class="ov-link-main" d="${ovLinePath(hubs[i], hubs[i + 1])}"></path>`);
  }

  // Branches orange (cadre + outils) — centre vignette vers centre vignette hub le plus proche.
  for (const p of framework) {
    const ref = nearestHubCenter(p, hubEls);
    lines.push(`<path class="ov-link-side" d="${ovCurvePath(ref, p, 0.22)}"></path>`);
  }
  for (const p of tools) {
    const ref = nearestHubCenter(p, hubEls);
    lines.push(`<path class="ov-link-side" d="${ovCurvePath(ref, p, 0.22)}"></path>`);
  }

  // Branche de synthèse.
  for (const p of closing) {
    const ref = hubs[hubs.length - 1];
    lines.push(`<path class="ov-link-side" d="${ovCurvePath(ref, p, 0.18)}"></path>`);
  }

  ovLinks.innerHTML = lines.join('');
}

function layoutOverview() {
  const W = ovCanvas.clientWidth;
  const H = ovCanvas.clientHeight;
  const cx = W / 2;
  const cy = H / 2;
  const root = [...ovCanvas.querySelectorAll('.ov-thumb.ov-root')];
  const hub = [...ovCanvas.querySelectorAll('.ov-thumb.ov-hub')];
  const tools = [...ovCanvas.querySelectorAll('.ov-thumb.ov-tool')];
  const framework = [...ovCanvas.querySelectorAll('.ov-thumb.ov-framework')];
  const closing = [...ovCanvas.querySelectorAll('.ov-thumb.ov-closing')];

  root.forEach(th => placeThumb(th, cx, 58, 'translate(-50%, 0)'));

  const hubStep = 168;
  hub.forEach((th, i) => {
    placeThumb(th, cx, cy + (i - (hub.length - 1) / 2) * hubStep);
  });

  const toolRadiusX = Math.min(W * 0.31, 340);
  const toolRadiusY = Math.min(H * 0.33, 250);
  const branchShift = Math.min(150, Math.max(82, W * 0.12));
  tools.forEach((th, i) => {
    const t = i / Math.max(tools.length - 1, 1);
    const angle = -Math.PI / 2 + (t * Math.PI);
    const x = cx + toolRadiusX * Math.cos(angle);
    const y = cy + toolRadiusY * Math.sin(angle);
    placeThumb(th, x + branchShift, y);
  });

  const frameRadiusX = Math.min(W * 0.28, 300);
  const frameRadiusY = Math.min(H * 0.3, 230);
  framework.forEach((th, i) => {
    const t = i / Math.max(framework.length - 1, 1);
    const angle = Math.PI / 2 + (t * Math.PI);
    const x = cx + frameRadiusX * Math.cos(angle);
    const y = cy + frameRadiusY * Math.sin(angle);
    placeThumb(th, x - branchShift, y);
  });

  const closeBottom = H - 22;
  const closeSpan = Math.min(W * 0.5, 620);
  const closeStart = cx - closeSpan / 2;
  closing.forEach((th, i) => {
    const x = closeStart + (i / Math.max(closing.length - 1, 1)) * closeSpan;
    placeThumb(th, x, closeBottom, 'translate(-50%, -100%)');
  });

  updateHubGuide(hub);
  requestAnimationFrame(() => drawOverviewLinks(root, hub, tools, framework, closing));
}

const AUTO_MS = 60000;
let autoTimer = null;

function scheduleAuto() {
  clearTimeout(autoTimer);
  if (overviewOpen) return;
  autoTimer = setTimeout(() => {
    const nextIdx = current < total - 1 ? current + 1 : 0;
    goto(nextIdx, { auto: true });
  }, AUTO_MS);
}

function onUserActivity() {
  scheduleAuto();
}

function goto(n, opts = {}) {
  if (n < 0 || n >= total) return;
  document.getElementById('slide-' + current).classList.remove('active');
  document.querySelectorAll('.dot')[current].classList.remove('active');
  document.querySelectorAll('.ov-thumb')[current].classList.remove('active');
  current = n;
  stage.style.transform = `translateX(-${current * 100}vw)`;
  document.getElementById('slide-' + current).classList.add('active');
  document.querySelectorAll('.dot')[current].classList.add('active');
  document.querySelectorAll('.ov-thumb')[current].classList.add('active');
  document.getElementById('nav-counter').textContent = String(current+1).padStart(2,'0') + ' / ' + String(total).padStart(2,'0');
  document.getElementById('progress-bar').style.width = ((current+1)/total*100) + '%';
  document.getElementById('nav-prev').disabled = current === 0;
  document.getElementById('nav-next').disabled = current === total - 1;
  document.getElementById('nav-side-prev').disabled = current === 0;
  document.getElementById('nav-side-next').disabled = current === total - 1;
  scheduleAuto();
}

function prev() { goto(current - 1); }
function next() { goto(current + 1); }

let overviewOpen = false;

function setOverview(open) {
  overviewOpen = open;
  document.body.classList.toggle('overview-open', open);
  const ov = document.getElementById('overview');
  const btn = document.getElementById('ov-btn');
  ov.classList.toggle('open', open);
  ov.setAttribute('aria-hidden', open ? 'false' : 'true');
  btn.classList.toggle('active', open);
  btn.setAttribute('aria-pressed', open ? 'true' : 'false');
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open) {
    clearTimeout(autoTimer);
    requestAnimationFrame(layoutOverview);
  } else {
    scheduleAuto();
  }
}

function toggleOverview() {
  setOverview(!overviewOpen);
}

window.addEventListener('resize', () => { if (overviewOpen) layoutOverview(); });

function toggleFS() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}

// Diffusion auto — 1 min sans interaction (souris, clavier, tactile)
['mousemove', 'mousedown', 'click', 'keydown', 'touchstart', 'wheel'].forEach(ev => {
  document.addEventListener(ev, () => { if (!overviewOpen) onUserActivity(); }, { passive: true });
});

// Keyboard
window.addEventListener('keydown', e => {
  if (overviewOpen) {
    if (e.key === 'Escape') { e.preventDefault(); setOverview(false); }
    return;
  }
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  if (e.key === 'f' || e.key === 'F') toggleFS();
  if (e.key === 'Tab') { e.preventDefault(); next(); }
  if (e.key >= '1' && e.key <= '9') goto(parseInt(e.key)-1);
});

// Touch swipe
let ts = 0;
document.addEventListener('touchstart', e => { ts = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  if (overviewOpen) return;
  const d = ts - e.changedTouches[0].clientX;
  if (Math.abs(d) > 50) d > 0 ? next() : prev();
}, {passive:true});

// Init
goto(0);
</script>
