<!-- ========================= 
     BALISES SEO – Template InCitta (à copier dans <head>)
========================= -->

<!-- Meta Description (150-160 caractères) -->
<meta name="description" content="[Description claire et concise de la page InCitta : aménagement du territoire, concertation, évaluation, ingénierie territoriale]">

<!-- Keywords (optionnel mais utile) -->
<meta name="keywords" content="aménagement du territoire, concertation citoyenne, évaluation des politiques publiques, ingénierie territoriale, InCitta">

<!-- URL Canonique -->
<link rel="canonical" href="https://www.incitta.eu/[nom-page].html">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.incitta.eu/[nom-page].html">
<meta property="og:title" content="[Titre de la page] – InCitta">
<meta property="og:description" content="[Description courte pour réseaux sociaux]">
<meta property="og:image" content="https://www.incitta.eu/assets/Logo/Logo%20InCitta.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="InCitta">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="https://www.incitta.eu/[nom-page].html">
<meta name="twitter:title" content="[Titre de la page] – InCitta">
<meta name="twitter:description" content="[Description courte pour Twitter]">
<meta name="twitter:image" content="https://www.incitta.eu/assets/Logo/Logo%20InCitta.png">

<!-- BreadcrumbList (pour pages internes) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [{
    "@type": "ListItem",
    "position": 1,
    "name": "Accueil",
    "item": "https://www.incitta.eu/"
  },{
    "@type": "ListItem",
    "position": 2,
    "name": "[Nom de la page]",
    "item": "https://www.incitta.eu/[nom-page].html"
  }]
}
</script>

<!-- Schema recommandé pour InCitta : Organization / LocalBusiness (pas Restaurant) -->
